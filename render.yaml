# Render Blueprint: web app + PostgreSQL + Redis (Key Value), all on free plans.
# Deploy: Render dashboard -> New -> Blueprint -> pick this repo.
# Values marked `sync: false` are asked for when the Blueprint is created.

services:
  - type: web
    name: polygon-migration-tool
    runtime: python
    plan: free
    region: singapore
    buildCommand: >-
      pip install -r requirement.txt &&
      cd PolygonMigration &&
      python manage.py collectstatic --noinput
    startCommand: >-
      cd PolygonMigration &&
      python manage.py migrate --noinput &&
      python manage.py ensure_superuser &&
      gunicorn PolygonMigration.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --timeout 180
    healthCheckPath: /users/login/
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: DATABASE_URL
        fromDatabase:
          name: polygon-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: polygon-redis
          property: connectionString
      # Polygon API (Settings -> API keys on polygon.codeforces.com)
      - key: POLYGON_API_KEY
        sync: false
      - key: POLYGON_API_SECRET
        sync: false
      # Cloud storage (Cloudflare R2)
      - key: STORAGE_PROVIDER
        value: r2
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET_NAME
        value: polygon-testcases
      # First login for the app (created on start if missing)
      - key: DJANGO_SUPERUSER_EMAIL
        sync: false
      - key: DJANGO_SUPERUSER_PASSWORD
        sync: false

  - type: keyvalue
    name: polygon-redis
    plan: free
    region: singapore
    ipAllowList: []   # internal connections only

databases:
  - name: polygon-db
    plan: free
    region: singapore
    databaseName: polygon_migration
    user: polygon_app
